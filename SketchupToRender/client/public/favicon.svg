<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="#090d16"/>
  
  <!-- Architectural Grid Lines (Subtle) -->
  <path d="M 64,128 L 448,128 M 64,256 L 448,256 M 64,384 L 448,384 M 128,64 L 128,448 M 256,64 L 256,448 M 384,64 L 384,448" 
        stroke="#1e293b" stroke-width="1.5" stroke-dasharray="8 8" />

  <!-- SketchUp-style Wireframe Cube (Left Side) -->
  <g stroke="#64748b" stroke-width="3" fill="none">
    <!-- Isometric Cube lines -->
    <!-- Front Face -->
    <path d="M 160,280 L 256,330 L 256,420 L 160,370 Z"/>
    <!-- Top Face -->
    <path d="M 160,280 L 256,230 L 352,280 L 256,330 Z"/>
    <!-- Right Face -->
    <path d="M 256,330 L 352,280 L 352,370 L 256,420 Z"/>
    <!-- Back lines (dashed) -->
    <path d="M 160,370 L 256,320 L 352,370" stroke-dasharray="4 4" stroke-width="1.5"/>
    <path d="M 256,230 L 256,320" stroke-dasharray="4 4" stroke-width="1.5"/>
  </g>

  <!-- Photorealistic Render AI Glow Overlay (Right / Bottom Side Overlay) -->
  <!-- We show the cube transforming into a solid glowing structure -->
  <g fill="url(#aiGlow)" opacity="0.85">
    <!-- Top Face Shaded -->
    <polygon points="256,330 352,280 352,370 256,420" fill="url(#rightFaceGrad)"/>
    <!-- Right Face Shaded -->
    <polygon points="160,280 256,330 256,420 160,370" fill="url(#leftFaceGrad)"/>
  </g>

  <!-- Laser Transition Line representing the "AI scan" -->
  <line x1="120" y1="350" x2="390" y2="215" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>

  <!-- AI Sparkles / Nodes -->
  <circle cx="256" cy="330" r="6" fill="#22d3ee" filter="url(#glow)"/>
  <circle cx="352" cy="280" r="4" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="160" cy="280" r="4" fill="#3b82f6" filter="url(#glow)"/>

  <!-- Definitions for Gradients and Filters -->
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <linearGradient id="leftFaceGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="rightFaceGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="aiGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>